name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Check architectures
        run: lipo -archs VinylWidget.app/Contents/MacOS/VinylWidget
      - name: Zip
        run: ditto -c -k --keepParent VinylWidget.app VinylWidget.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VinylWidget
          path: VinylWidget.zip
